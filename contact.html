<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #f4f5ff; color: #17182d; }
        main { width: min(100%, 620px); padding: 36px; border-radius: 20px; background: white; text-align: center; box-shadow: 0 12px 35px #17182d15; }
        h1 span { color: #7c3aed; }
        p { line-height: 1.7; }
        .btn { display: inline-block; margin: 10px 6px 0; padding: 13px 22px; border-radius: 10px; background: #7c3aed; color: white; text-decoration: none; }
        .btn:hover { background: #9b65ff; }
        .btn-outline { background: white; border: 1px solid #7c3aed; color: #7c3aed; }
        .contact-form { display: grid; gap: 16px; margin-top: 28px; text-align: left; }
        .contact-form label { display: grid; gap: 7px; font-weight: bold; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 12px; border: 1px solid #c8c9da; border-radius: 8px; font: inherit; }
        .contact-form textarea { min-height: 130px; resize: vertical; }
        .contact-form .btn { justify-self: center; border: 0; cursor: pointer; font-size: 16px; }
        .form-note { font-size: 14px; color: #45465d; }
    </style>
</head>
<body>
    <main>
        <h1>Contact <span data-contact="name">Anand R</span></h1>
        <p>📧 Email: <span data-contact="email">anandr3880@gmail.com</span></p>
        <p>📱 Phone: <span data-contact="phone">+91 8105559024</span></p>
        <p>📍 Location: <span data-contact="location">Chennai, India</span></p>
        <form class="contact-form">
            <label>
                Your name
                <input type="text" name="name" autocomplete="name" maxlength="120" required>
            </label>
            <label>
                Your email
                <input type="email" name="email" autocomplete="email" maxlength="254" required>
            </label>
            <label>
                Your phone (optional)
                <input type="tel" name="phone" autocomplete="tel" maxlength="40">
            </label>
            <label>
                Message
                <textarea name="message" maxlength="5000" required></textarea>
            </label>
            <button type="submit" class="btn">Submit Message</button>
            <p class="form-note" role="status" aria-live="polite">Your message will be submitted to my spreadsheet.</p>
        </form>
        <a class="btn btn-outline" href="First_proj.html">Back to Home</a>
    </main>
    <script src="contact.js"></script>
</body>
</html>
